<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      No viewport meta and no external anything. This document is loaded from a custom scheme inside a
      WKWebView with no network access, so every byte it needs is inlined by the bundler. A <link> to a
      CDN would not merely be slow here — it would not resolve at all.
    -->
    <title>Pane</title>
    <style>__STYLES__</style>
  </head>
  <body>
    <div class="pane" id="pane" data-focused>
      <!--
        Title bar: one close dot, then the title (empty until you scroll past the H1), then exactly
        three buttons. Decision 22 fixes this list; anything new goes in ⌘K instead (decision 17).
      -->
      <header class="pane__titlebar" id="titlebar">
        <button class="pane__close" id="close" aria-label="Close pane"></button>
        <div class="pane__title" id="pane-title"></div>

        <!-- The pin is STATE, not a permanent control: it is in the bar only while the pane is
             pinned, and clicking it there unpins. As a fourth always-present button it was the one
             icon in the title bar whose meaning nobody could read off it — decision 54. -->
        <button class="icon-button" id="pin" data-action="pin" aria-label="Unpin pane" aria-pressed="false" title="Unpin ⇧⌘P">
          <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
            <circle class="pin-head" cx="7" cy="5" r="3" fill="none" stroke="currentColor" stroke-width="1.5" />
            <line class="pin-stem" x1="7" y1="8" x2="7" y2="13" stroke="currentColor" stroke-width="1.5" />
          </svg>
        </button>

        <button class="icon-button icon-button--cmd" id="open-actions" data-action="actions" aria-label="Actions" title="Actions ⌘K">⌘</button>

        <button class="icon-button" id="browse" data-action="browse" aria-label="Browse notes" title="Notes ⌘P">
          <span class="icon-button__lines" aria-hidden="true"><i></i><i></i><i></i></span>
        </button>

        <button class="icon-button icon-button--plus" id="new-note" data-action="new" aria-label="New note" title="New note ⌘N">+</button>
      </header>

      <!--
        One line, above the content, for the three states the design record never drew: a conflict
        sibling was written (decision 8), a note is coming down from iCloud (decision 13), or
        something went wrong. No button — decision 8 is explicit that the pane is never made
        read-only and that typing must not have to be resumed. It is dismissed by being fixed, or by
        clicking it.
      -->
      <!-- Transient confirmation for something destructive. Absolutely positioned on purpose:
           the banner below is in the layout and feeds `reportContentHeight`, so a message that
           comes and goes there would pulse the window (decision 44's hazard). This floats. -->
      <div class="pane__toast" id="toast" role="status" aria-live="polite" hidden></div>

      <div class="pane__banner" id="banner" role="status" hidden>
        <span class="pane__banner-dot" aria-hidden="true"></span>
        <span class="pane__banner-text" id="banner-text"></span>
      </div>

      <div class="pane__content">
        <div class="pane__scroll" id="editor-host"></div>
        <div class="pane__fade" aria-hidden="true"></div>
      </div>

      <!-- One footer row. The format bar replaces it rather than stacking below it. -->
      <footer class="pane__footer">
        <!-- The ⌘K hint that used to sit here is gone: the title bar carries a ⌘ button now
             (decision 54), which is the discovery path frame 2a traded away and then a better one
             than a word in a corner. -->
        <span class="pane__footer-spacer"></span>
        <span class="pane__words" id="word-count">0 words</span>
        <span class="pane__footer-spacer"></span>
        <button class="icon-button icon-button--sm" id="format-toggle" aria-label="Formatting" title="Format ⌥⌘,">Aa</button>
      </footer>

      <div class="format-bar" id="format-bar" role="toolbar" aria-label="Formatting"></div>

      <!-- ⌘F. The third state of the footer row — see the note at the top of find.ts. -->
      <div class="find" id="find" role="search" aria-label="Find in note"></div>

      <!-- Everything the pane holds that is not the open overlay. Covers the whole pane, takes the
           click that would otherwise land in the note behind, and closes the overlay with it. -->
      <div class="pane__scrim" id="overlay-scrim" aria-hidden="true"></div>

      <!-- ⌘P. Lives inside the pane; see the note at the top of switcher.css. -->
      <div class="switcher" id="switcher" role="dialog" aria-label="Browse notes">
        <input
          class="switcher__search"
          id="switcher-search"
          type="text"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
          aria-controls="switcher-list"
        />
        <div class="switcher__list" id="switcher-list" role="listbox" aria-label="Notes"></div>
        <div class="switcher__footer" id="switcher-footer"></div>
      </div>

      <!-- ⌘K. Decision 17: everything that is not pin, switcher or new lives here, which is what
           keeps the title bar at three icons forever. Built the same way as the switcher above. -->
      <div class="actions" id="actions" role="dialog" aria-label="Actions">
        <input
          class="actions__search"
          id="actions-search"
          type="text"
          placeholder="Search actions…"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
          aria-controls="actions-list"
        />
        <div class="actions__list" id="actions-list" role="listbox" aria-label="Actions"></div>
      </div>
    </div>

    <script>__SCRIPT__</script>
  </body>
</html>
